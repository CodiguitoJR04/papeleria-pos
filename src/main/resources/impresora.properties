# ============================================================
#  Configuración de impresora térmica
# ============================================================

# Nombre EXACTO de la impresora en Windows.
# Usa "DEFAULT" para la impresora predeterminada del sistema.
impresora.nombre=DEFAULT

# Ancho del papel en caracteres:
#   32 = papel de 58mm
#   48 = papel de 80mm (estándar)
impresora.ancho=48

# Charset para acentos:
#   CP850, CP437, ISO-8859-1
impresora.charset=CP850

# Comandos opcionales (si la impresora no los soporta, se ignoran)
impresora.cortar=true
impresora.abrirCajon=true
# Abrir cajón solo cuando el método de pago es efectivo
impresora.abrirCajonSoloEfectivo=true

# Copias por venta (1 = solo cliente)
impresora.copias=1

# ============================================================
#  Datos del negocio (aparecen en el encabezado del ticket)
# ============================================================
negocio.nombre=Papelería
negocio.direccion=
negocio.telefono=
negocio.rfc=

# ============================================================
#  Texto del pie del ticket
# ============================================================
ticket.footer=¡Gracias por su compra!