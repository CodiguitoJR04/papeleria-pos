name: Build & Release

on:
  push:
    tags:
      - 'v*'          # Se dispara cuando subes un tag que empieza con "v"
  workflow_dispatch:  # También permite correrlo a mano desde GitHub

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write   # Necesario para publicar en Releases

    steps:
      # 1. Clonar el repo
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Configurar JDK 21 (Temurin, igual que usas local)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      
      # 3. Configurar WiX v3 (ya viene preinstalado en el runner)
      - name: Setup WiX v3
        run: |
          $wix = Get-ChildItem "C:\Program Files (x86)\WiX Toolset v3*\bin\candle.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $wix) {
            Write-Host "No se encontró WiX, instalando..."
            choco install wixtoolset --force -y --no-progress
            $wix = Get-ChildItem "C:\Program Files (x86)\WiX Toolset v3*\bin\candle.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($null -eq $wix) {
            Write-Error "No se pudo encontrar candle.exe"
            exit 1
          }
          $wixBin = Split-Path $wix.FullName
          Write-Host "✔ WiX encontrado en: $wixBin"
          $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      # 4. Compilar y empaquetar con Maven (genera el .exe)
      - name: Build with Maven
        run: mvn -B clean package

      # 5. Verificar que el .exe se generó
      - name: Verify installer
        run: |
          if (Test-Path "target\installer\PapeleriaPOS-*.exe") {
            Write-Host "✔ Instalador generado"
            Get-ChildItem target\installer\
          } else {
            Write-Error "✖ No se generó el instalador"
            exit 1
          }
        shell: pwsh

      # 6. Publicar el .exe en GitHub Releases (solo si es un tag)
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/installer/PapeleriaPOS-*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}