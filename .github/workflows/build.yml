name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Sync version from tag to pom.xml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          Write-Host "Version detected from tag: $version"
          mvn -B versions:set "-DnewVersion=$version" "-DgenerateBackupPoms=false"
          mvn -B versions:set-property "-Dproperty=app.version" "-DnewVersion=$version" "-DgenerateBackupPoms=false"
        shell: pwsh

      - name: Update app.properties
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          Write-Host "Updating app.properties to version: $version"
          "app.version=$version" | Out-File -FilePath "src/main/resources/app.properties" -Encoding utf8
          Get-Content src/main/resources/app.properties
        shell: pwsh

      - name: Setup WiX v3
        run: |
          $wix = Get-ChildItem "C:\Program Files (x86)\WiX Toolset v3*\bin\candle.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $wix) {
            Write-Host "Installing WiX..."
            choco install wixtoolset --force -y --no-progress
            $wix = Get-ChildItem "C:\Program Files (x86)\WiX Toolset v3*\bin\candle.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          $wixBin = Split-Path $wix.FullName
          Write-Host "WiX found at: $wixBin"
          $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Build with Maven
        run: mvn -B clean package

      - name: Verify installer
        run: |
          $exe = Get-ChildItem "target\installer\PapeleriaPOS-*.exe" -ErrorAction SilentlyContinue
          if ($null -eq $exe) {
            Write-Error "Installer not generated"
            exit 1
          }
          Write-Host "Installer generated: $($exe.Name)"
        shell: pwsh

      - name: Generate version.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $exe = Get-ChildItem "target\installer\PapeleriaPOS-*.exe" | Select-Object -First 1
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/$($exe.Name)"
          
          $notes = "${{ github.event.head_commit.message }}"
          if (-not $notes) { $notes = "New version $version" }

          $json = @{
            version = $version
            url     = $url
            notes   = $notes
          } | ConvertTo-Json -Compress

          $json | Out-File -FilePath "version.json" -Encoding utf8
          Write-Host "version.json generated successfully"
        shell: pwsh

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/installer/PapeleriaPOS-*.exe
            version.json
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}