name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # 🔑 Sincroniza el pom.xml con la versión del tag
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          Write-Host "✔ Versión detectada del tag: $version"

          mvn -B versions:set "-DnewVersion=$version" "-DgenerateBackupPoms=false"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          mvn -B versions:set-property "-Dproperty=app.version" "-DnewVersion=$version" "-DgenerateBackupPoms=false"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Write-Host "✔ pom.xml actualizado a la versión $version"
          Select-String -Path "pom.xml" -Pattern "<version>|<app.version>"
        shell: pwsh

      - name: Setup WiX v3
        run: |
          $wix = Get-ChildItem "C:\Program Files (x86)\WiX Toolset v3*\bin\candle.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $wix) {
            Write-Host "No se encontró WiX, instalando..."
            choco install wixtoolset --force -y --no-progress
            $wix = Get-ChildItem "C:\Program Files (x86)\WiX Toolset v3*\bin\candle.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($null -eq $wix) {
            Write-Error "No se pudo encontrar candle.exe"
            exit 1
          }
          $wixBin = Split-Path $wix.FullName
          Write-Host "✔ WiX encontrado en: $wixBin"
          $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Build with Maven
        run: mvn -B clean package

      - name: Verify installer
        run: |
          Get-ChildItem target\installer\
          $exe = Get-ChildItem "target\installer\PapeleriaPOS-*.exe" -ErrorAction SilentlyContinue
          if ($null -eq $exe) {
            Write-Error "✖ No se generó el instalador"
            exit 1
          }
          Write-Host "✔ Instalador generado: $($exe.Name)"
        shell: pwsh

      # Genera version.json con la versión REAL del .exe generado
      - name: Generate version.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')

          # Buscar el .exe real para sacar el nombre exacto
          $exe = Get-ChildItem "target\installer\PapeleriaPOS-*.exe" | Select-Object -First 1
          $exeName = $exe.Name
          Write-Host "✔ Instalador detectado: $exeName"

          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/$exeName"

          $notes = "${{ github.event.head_commit.message }}"
          if (-not $notes) { $notes = "Nueva versión $version" }

          $json = @{
            version = $version
            url     = $url
            notes   = $notes
          } | ConvertTo-Json -Compress

          $json | Out-File -FilePath "version.json" -Encoding utf8
          Write-Host "✔ version.json generado:"
          Get-Content version.json
        shell: pwsh

      # Publica .exe + version.json
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/installer/PapeleriaPOS-*.exe
            version.json
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}